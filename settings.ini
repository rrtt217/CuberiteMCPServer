; MCPServer plugin settings (read with cIniFile).
; [VoidGuard] protects players and MCC bots from the "death -> cannot respawn
; -> endless void-fall/suffocation loop". The guard hooks HOOK_PLAYER_MOVING
; and acts ONLY when the player's body is EMBEDDED in solid blocks (the
; signature of the MCC loop: the client reports a position inside the
; terrain) below VoidY -- legit underground play, swimming or slopes are
; never inside a solid block and are never touched. Rescues teleport the
; player back up to SafeY (x/z preserved), rate-limited to once per second
; per player, with at most one log line per 30 seconds per player.

[VoidGuard]
Enabled=true
VoidY=30
SafeY=74

