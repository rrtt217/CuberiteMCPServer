; MCPServer plugin settings (read with cIniFile).
; [VoidGuard] protects players and MCC bots from the "death -> cannot respawn
; -> endless void-fall/suffocation loop". The guard hooks HOOK_PLAYER_MOVING
; and acts ONLY when a player's movement would put their body below VoidY
; while EMBEDDED in solid blocks (the signature of the MCC loop) -- legit
; underground play, swimming or slopes are never inside a solid block and are
; never touched. On detection the player is teleported back up to SafeY (x/z
; preserved), full-health is restored, and all movement is refused for the
; next 10 world ticks (HOOK_WORLD_TICK counts down) so the server can
; force-sync the real position back to the client. At most one log line per
; 30 seconds per player.

[VoidGuard]
Enabled=true
VoidY=40
SafeY=74

