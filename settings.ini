; MCPServer plugin settings (read with cIniFile).
; [VoidGuard] protects players and MCC bots from the "death -> cannot respawn
; -> endless void fall" loop. When a player's movement would take them below
; VoidY, the move is refused and the player is teleported back up to SafeY
; (their x/z is preserved). Both actions are rate-limited to once per second
; per player, and each stuck player logs at most once per 30 seconds.

[VoidGuard]
Enabled=true
VoidY=40
SafeY=74

